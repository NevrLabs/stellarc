<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellarc — Runtimes &amp; Nodes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0a0b'/%3E%3Cpath d='M8 3L12 8l-4 5-4-5z' fill='%23c9c9c9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Stellarc design mockup — Runtimes / Nodes (BYO-agent)
   Tokens mirror apps/stellarc-ui/src/index.css (.dark) + DESIGN_SYSTEM.md.
   Type: Cal Sans → IBM Plex fallback (Inter-free per VISION).
   ───────────────────────────────────────────────────────────────────────── */
:root {
  --font-sans: "Cal Sans UI", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-heading: "Cal Sans Heading", "IBM Plex Sans", var(--font-sans);
  --font-mono: "Paper Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-sm: 3px; --radius: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-full: 999px;

  /* surfaces (index.css .dark) */
  --background: #0a0a0b;
  --bg-elev: #131315;
  --bg-elev-2: #1b1b1d;
  --bg-hover: #232326;
  --bg-active: #2a2a2e;
  --border: #262629;
  --border-strong: #3a3a3e;
  --border-faint: #1d1d1f;
  /* text */
  --foreground: #e6e6e6;
  --text-dim: #999a9c;
  --text-faint: #7e7e81;
  /* silver accent */
  --accent: #c9c9c9;
  --accent-bright: #d8d8d8;
  --on-accent: #0b0b0b;
  --accent-wash: rgba(201, 201, 201, 0.10);
  --accent-wash-2: rgba(201, 201, 201, 0.16);
  --accent-line: rgba(201, 201, 201, 0.28);
  /* semantic status (soft pastels, apart from accent) */
  --ok: #86efac;    --ok-wash: rgba(134, 239, 172, 0.10);   --ok-line: rgba(134, 239, 172, 0.26);
  --warn: #fcd34d;  --warn-wash: rgba(252, 211, 77, 0.09);  --warn-line: rgba(252, 211, 77, 0.26);
  --err: #fca5a5;   --err-wash: rgba(252, 165, 165, 0.09);  --err-line: rgba(252, 165, 165, 0.26);
  --info: #60a5fa;  --info-wash: rgba(96, 165, 250, 0.10);  --info-line: rgba(96, 165, 250, 0.26);
  /* misc */
  --overlay: rgba(4, 4, 5, 0.62);
  --shadow-pop: 0 12px 34px rgba(0,0,0,.55);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.6);
  --dur-fast: 80ms; --dur: 120ms; --dur-slow: 150ms;
  --ease: cubic-bezier(.2,0,0,1);
  --sidebar-w: 220px;
  --topbar-h: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
*::-webkit-scrollbar-track { background: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; border-radius: var(--radius-sm);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 600; letter-spacing: -0.02em; margin: 0; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--font-mono); }
.micro {
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint);
}

/* ── app shell ─────────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100vh; }

/* sidebar */
.sidebar {
  background: var(--bg-elev); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; z-index: 40;
}
.side-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px; }
.wordmark { display: flex; align-items: center; gap: 7px; font-family: var(--font-heading); font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
.wordmark svg { display: block; }
.side-search {
  margin: 2px 8px 8px; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-elev-2); color: var(--text-faint);
  padding: 4px 8px; font-size: 12px; cursor: pointer;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.side-search:hover { border-color: var(--border-strong); color: var(--text-dim); }
.side-search .kbd { margin-left: auto; }
.kbd {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-faint);
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: var(--radius-sm);
  padding: 1px 4px; background: var(--bg-elev);
}
.side-scroll { flex: 1; overflow-y: auto; padding: 2px 8px 8px; min-height: 0; }
.nav-sec { margin-top: 12px; }
.nav-sec:first-child { margin-top: 4px; }
.nav-sec > .micro { display: block; padding: 0 8px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 4px 8px; border-radius: var(--radius); font-size: 12px; font-weight: 500;
  color: var(--text-dim); text-align: left;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.nav-item:hover { background: var(--accent-wash); color: var(--foreground); }
.nav-item.active { background: var(--accent-wash-2); color: var(--foreground); }
.nav-item svg { flex-shrink: 0; opacity: 0.75; }
.nav-item .count { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
.nav-item .dotlive { margin-left: auto; }
.side-foot {
  border-top: 1px solid var(--border-faint); padding: 8px 10px;
  display: flex; align-items: center; gap: 8px;
}
.side-foot .ver { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); }
.avatar {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: var(--bg-active); color: var(--foreground);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; font-family: var(--font-mono);
  border: 1px solid var(--border-strong);
}

/* main column */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  height: var(--topbar-h); flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--background);
}
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--foreground); font-weight: 600; }
.crumbs .sep { color: var(--text-faint); font-family: var(--font-mono); font-size: 10px; }
.hamburger { display: none; }
.topbar .spacer { flex: 1; }

/* mockup state switcher (design-review affordance) */
.stateswitch { display: flex; align-items: center; gap: 6px; }
.stateswitch > .micro { padding-right: 2px; }
.seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-elev); }
.seg button {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.02em;
  color: var(--text-faint); padding: 3px 9px;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { color: var(--foreground); background: var(--accent-wash); }
.seg button.on { background: var(--accent-wash-2); color: var(--foreground); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius);
  font-size: 12px; font-weight: 500; padding: 4px 10px; white-space: nowrap;
  border: 1px solid transparent;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.btn:active { transform: translateY(0.5px); }
.btn-primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent-bright); }
.btn-secondary { border-color: var(--border); color: var(--foreground); background: var(--bg-elev); }
.btn-secondary:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.btn-ghost { color: var(--text-dim); }
.btn-ghost:hover { color: var(--foreground); background: var(--accent-wash); }
.btn-danger { border-color: var(--err-line); color: var(--err); background: transparent; }
.btn-danger:hover { background: var(--err-wash); }
.btn-sm { padding: 2px 8px; font-size: 11px; }
.btn svg { flex-shrink: 0; }

/* stat row */
.statrow {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px 8px; border-bottom: 1px solid var(--border-faint);
}
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat .v { font-family: var(--font-mono); font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
.stat .k { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); }
.stat .v.ok { color: var(--ok); } .stat .v.warn { color: var(--warn); } .stat .v.err { color: var(--err); }
.statrule { width: 1px; height: 14px; background: var(--border); }

/* content / table */
.content { flex: 1; overflow-y: auto; min-height: 0; padding: 0 16px 24px; }
.viewhead { display: flex; align-items: center; gap: 8px; padding: 12px 2px 6px; }
.viewhead .micro { flex: 1; }
.ntable { width: 100%; border-collapse: collapse; }
.ntable th {
  font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-faint); text-align: left;
  padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0;
  background: var(--background); z-index: 2;
}
.ntable td { padding: 0 8px; border-bottom: 1px solid var(--border-faint); vertical-align: middle; height: 34px; white-space: nowrap; }
.ntable tbody tr { cursor: pointer; transition: background var(--dur-fast) var(--ease); }
.ntable tbody tr:hover { background: var(--accent-wash); }
.ntable tbody tr.sel { background: var(--accent-wash-2); }
.cell-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cell-name .nm { font-weight: 600; font-size: 12.5px; }
.cell-name .id { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
.cell-owner { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
.cell-ver { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.cell-harness { display: flex; gap: 4px; align-items: center; }
.cell-seen { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
.cell-runs { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
tr.is-revoked .nm, tr.is-revoked .cell-ver, tr.is-revoked .cell-seen { opacity: 0.45; }

/* dots + pills */
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot-ok { background: var(--ok); box-shadow: 0 0 0 0 rgba(134,239,172,.5); }
.dot-live { animation: pulse 1.6s var(--ease-in-out, ease-in-out) infinite; }
.dot-warn { background: var(--warn); }
.dot-err { background: var(--err); }
.dot-faint { background: var(--text-faint); }
.dot-accent { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(201,201,201,.35);} 70% { box-shadow: 0 0 0 5px rgba(201,201,201,0);} 100% { box-shadow: 0 0 0 0 rgba(201,201,201,0);} }
.dot-ok.dot-live { animation: pulse-ok 1.6s ease-in-out infinite; }
@keyframes pulse-ok { 0% { box-shadow: 0 0 0 0 rgba(134,239,172,.45);} 70% { box-shadow: 0 0 0 5px rgba(134,239,172,0);} 100% { box-shadow: 0 0 0 0 rgba(134,239,172,0);} }

.pill {
  display: inline-flex; align-items: center; gap: 5px; border-radius: var(--radius-full);
  font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.05em;
  text-transform: uppercase; padding: 1.5px 7px 1.5px 6px; white-space: nowrap;
}
.pill .dot { width: 5px; height: 5px; }
.pill-ok { background: var(--ok-wash); color: var(--ok); border: 1px solid var(--ok-line); } .pill-ok .dot { background: var(--ok); }
.pill-warn { background: var(--warn-wash); color: var(--warn); border: 1px solid var(--warn-line); } .pill-warn .dot { background: var(--warn); }
.pill-err { background: var(--err-wash); color: var(--err); border: 1px solid var(--err-line); } .pill-err .dot { background: var(--err); }
.pill-neutral { background: var(--accent-wash); color: var(--text-dim); border: 1px solid var(--border); } .pill-neutral .dot { background: var(--text-faint); }
.pill-info { background: var(--info-wash); color: var(--info); border: 1px solid var(--info-line); } .pill-info .dot { background: var(--info); }
.pill-live .dot { animation: blink 1.5s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }

.hchip {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 1px 5px; background: var(--bg-elev);
}
.hchip.more { color: var(--text-faint); border-style: dashed; }
.tag-ver { font-family: var(--font-mono); font-size: 9px; color: var(--warn); border: 1px solid var(--warn-line); background: var(--warn-wash); border-radius: var(--radius-full); padding: 0.5px 5px; margin-left: 6px; letter-spacing: 0.03em; }
.tag-revoked { font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 0.5px 5px; margin-left: 6px; letter-spacing: 0.05em; }

/* empty / loading / error views */
.bigstate { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 72px 24px 48px; gap: 0; min-height: 52vh; }
.bigstate .glyph { color: var(--border-strong); margin-bottom: 18px; }
.bigstate h2 { font-size: 15px; font-weight: 600; }
.bigstate p { margin: 6px 0 0; color: var(--text-dim); font-size: 12.5px; max-width: 380px; line-height: 1.6; }
.bigstate .actions { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
.bigstate .hint { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); border: 1px solid var(--border-faint); background: var(--bg-elev); border-radius: var(--radius); padding: 5px 10px; }
.skelly { padding: 6px 2px; }
.sk { position: relative; overflow: hidden; border-radius: var(--radius); background: var(--bg-elev-2); }
.sk::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(230,230,230,0.045), transparent);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }
.sk-row { display: grid; grid-template-columns: 18px 1.6fr 0.8fr 0.6fr 1.2fr 0.5fr 0.6fr; gap: 10px; align-items: center; height: 34px; padding: 0 8px; border-bottom: 1px solid var(--border-faint); }
.errorcard {
  margin-top: 40px; border: 1px solid var(--err-line); background: var(--err-wash);
  border-radius: var(--radius-md); padding: 16px 18px; max-width: 460px; text-align: left;
}
.errorcard .row { display: flex; align-items: center; gap: 8px; }
.errorcard h3 { font-size: 13px; }
.errorcard code { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 9px; }

/* ── drawer (node / run detail) ────────────────────────────────────────── */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw;
  background: var(--bg-elev); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 60;
  transform: translateX(102%); transition: transform 150ms var(--ease);
  box-shadow: var(--shadow-pop);
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.drawer-head .back { color: var(--text-faint); display: inline-flex; padding: 2px; border-radius: var(--radius-sm); }
.drawer-head .back:hover { color: var(--foreground); background: var(--accent-wash); }
.drawer-title { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.drawer-title .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-title .id { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
.iconbtn { color: var(--text-faint); display: inline-flex; padding: 3px; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
.iconbtn:hover { color: var(--foreground); background: var(--accent-wash); }
.drawer-body { flex: 1; overflow-y: auto; padding: 0 0 24px; min-height: 0; }

.banner { display: flex; gap: 9px; align-items: flex-start; margin: 12px 14px 0; border-radius: var(--radius-md); padding: 9px 11px; font-size: 12px; line-height: 1.55; }
.banner .dot { margin-top: 5px; }
.banner b { font-weight: 600; }
.banner .sub { color: var(--text-dim); }
.banner-ok { background: var(--ok-wash); border: 1px solid var(--ok-line); }
.banner-warn { background: var(--warn-wash); border: 1px solid var(--warn-line); }
.banner-err { background: var(--err-wash); border: 1px solid var(--err-line); }
.banner-neutral { background: var(--accent-wash); border: 1px solid var(--border); }

.sect { margin: 16px 14px 0; }
.sect > .micro { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
.sect > .micro .n { color: var(--text-faint); font-weight: 400; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; }
.kv .k { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); padding-top: 2px; }
.kv .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); min-width: 0; overflow-wrap: anywhere; }
.kv .v.fg { color: var(--foreground); }

.agentrow {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border-faint); border-radius: var(--radius-md); background: var(--bg-elev-2);
  margin-bottom: 6px; transition: border-color var(--dur) var(--ease);
}
.agentrow:hover { border-color: var(--border-strong); }
.agentrow .glyph { width: 22px; height: 22px; border-radius: var(--radius); background: var(--bg-active); border: 1px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; font-weight: 600; flex-shrink: 0; margin-top: 1px; }
.agentrow .body { flex: 1; min-width: 0; }
.agentrow .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.agentrow .anm { font-weight: 600; font-size: 12.5px; }
.agentrow .model { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }
.agentrow .model .note { color: var(--text-faint); }
.agentrow .instr { margin-top: 3px; font-size: 11.5px; color: var(--text-dim); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.agentrow .foot { margin-top: 4px; display: flex; gap: 10px; font-family: var(--font-mono); font-size: 9px; color: var(--text-faint); letter-spacing: 0.03em; }

.runrow {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; width: 100%; text-align: left;
  border: 1px solid var(--border-faint); border-radius: var(--radius-md); background: var(--bg-elev-2);
  margin-bottom: 6px; transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.runrow:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.runrow .tid { font-family: var(--font-mono); font-size: 11px; color: var(--foreground); }
.runrow .subj { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.runrow .subj b { color: var(--foreground); font-weight: 500; }
.runrow .when { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }

.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 80; opacity: 0; pointer-events: none; transition: opacity 150ms var(--ease); }

.field label { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 5px; }

@keyframes spin { to { transform: rotate(360deg); } }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 8px); z-index: 120;

@media (prefers-reduced-motion: reduce) {

}

"use strict";
/* ════════════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════════════ */
const SERVER = "https://stellarc.nevr.dev";

const NODES = [
  {
    id: "node_8f3a91c2d04b", name: "talos-tower", owner: "Talos", status: "online",
    version: "0.4.1", harnesses: ["hermes", "claude-code", "opencode", "codex"],

    workRoot: "~/.local/share/stellarc-node/work", machine: "Threadripper · Arch Linux",

  return `<tr class="nrow${sel}${rev}" data-id="${n.id}" tabindex="0">

function bannerHTML(n) {
  switch (n.status) {
    case "online":
      return `<div class="banner banner-ok"><span class="dot dot-ok dot-live"></span><div><b>Online.</b> <span class="sub">Heartbeat healthy · lease renewed every 20s · ${n.active} of ${n.concurrency} slots busy.</span></div></div>`;
    case "degraded":
      return `<div class="banner banner-warn"><span class="dot dot-warn"></span><div><b>Degraded — heartbeat flapping.</b> <span class="sub">3 missed intervals (last seen ${n.lastSeen} ago). One task was requeued after lease expiry (<span class="mono" style="font-size:10.5px">platform.lease_expired</span>) and re-claimed by another node. Node v${n.version} is behind the plane (0.4.1) — the old claim loop misses every other heartbeat.</span></div></div>`;
    case "offline":
      return `<div class="banner banner-err"><span class="dot dot-err"></span><div><b>Offline — last seen ${n.lastSeen} ago.</b> <span class="sub">2 queued tasks are waiting on this node. Leases on in-flight work expired and tasks were reaped back to <span class="mono" style="font-size:10.5px">queued</span>; a node that went dark cannot report on a re-claimed attempt (409).</span></div></div>`;
    case "revoked":
      return `<div class="banner banner-neutral"><span class="dot dot-faint"></span><div><b>Token revoked.</b> <span class="sub">Reports from this node fail authentication and its agents can no longer be assigned work. To reconnect, create a new node — the old token is gone for good.</span></div></div>`;
    case "waiting":
      return `<div class="banner banner-neutral"><span class="dot dot-accent"></span><div><b>Waiting for hello.</b> <span class="sub">Node registered, token hashed (sha256). Listening for the first <span class="mono" style="font-size:10.5px">POST /v1/node/hello</span> with version + harnesses.</span></div></div>`;
  }
  return "";
}

function agentHTML(a) {
  const model = a.model
    ? `<span class="model">${esc(a.model)}${a.applied === false ? ' <span class="note">· requested, not applied</span>' : ""}</span>`
    : `<span class="model"><span class="note">harness default</span></span>`;
  return `<div class="agentrow">
    <span class="glyph">${esc(a.name[0].toUpperCase())}</span>
    <div class="body">
      <div class="top"><span class="anm">${esc(a.name)}</span><span class="hchip">${esc(a.harness)}</span>${model}</div>

  for (const n of allNodes()) { const r = n.runs.find((x) => x.id === taskId); if (r) return [n, r]; }

}
function openRun(taskId) {
  S.panel = { t: "run", taskId };

}

function titemHTML(it) {
  const stream = it.streaming ? `<span class="streaming"><span class="cur"></span></span>` : "";
  if (it.kind === "config")
    return `<div class="titem t-config"><div class="tmeta"><span class="kind">config</span><span class="at">${it.at}</span></div><div class="tbody">${it.html}</div></div>`;
  if (it.kind === "thinking")
    return `<div class="titem t-think"><div class="tmeta"><span class="kind">thinking</span><span class="at">${it.at}</span></div><div class="tbody">${esc(it.body)}</div></div>`;
  if (it.kind === "message")
    return `<div class="titem t-msg"><div class="tmeta"><span class="kind">message</span><span class="at">${it.at}</span></div><div class="tbody">${esc(it.body)}${stream}</div></div>`;
  if (it.kind === "tool_call")
    return `<div class="titem t-tool"><div class="tmeta"><span class="kind">tool_call</span><span class="at">${it.at}</span></div>
      <div class="toolcard"><div class="thd"><span class="tool">${esc(it.tool)}</span>${it.dur ? `<span class="dur">${it.dur}</span>` : ""}</div><pre>${esc(it.body)}</pre></div></div>`;
  if (it.kind === "tool_result") {
    const long = it.body.split("\n").length > 14;
    return `<div class="titem t-tool"><div class="tmeta"><span class="kind">tool_result</span><span class="at">${it.at}</span></div>
      <div class="toolcard result${long ? "" : " open"}"><div class="thd"><span class="tool">${esc(it.tool)}</span></div><pre class="${it.cls || ""}">${esc(it.body)}</pre>${long ? `<button class="showmore">▸ show 34 more lines</button>` : ""}</div></div>`;
  }
  return `<div class="titem"><div class="tmeta"><span class="kind">${esc(it.kind)}</span></div><div class="tbody mono">${esc(JSON.stringify(it.body))}</div></div>`;
}

        <h3>Hello received — node online</h3>
        <p><span class="mono" style="font-size:11px">v0.4.1</span> · 3 harnesses: <span class="mono" style="font-size:11px">hermes, claude-code, codex</span><br>Bind an agent to <b>${esc(c.name)}</b> and give it work.</p>
        <div class="actions" style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-primary" id="cView">View node</button>
          <button class="btn btn-secondary" id="cAgent">Create agent on this node</button>
        </div>
      </div>`;
    foot.innerHTML = `<span style="flex:1"></span><button class="btn btn-ghost" id="cDone">Done</button>`;
    $("cDone").onclick = closeConnect;
    $("cView").onclick = () => { const id = c.nodeKey; closeConnect(); setView("populated"); openNode(id); };
    $("cAgent").onclick = () => { closeConnect(); toast("Agent form — out of scope for this mockup"); };
  }
}
function playHello() {
  const term = $("helloTerm");
  if (!term || helloTimer) return;
  const lines = [
    [900, `<span class="t">14:41:05</span>  listening for hello · long-poll /v1/node/claim (waitMs 30000)`],
    [2100, `<span class="t">14:41:07</span>  …`],
    [3400, `<span class="t">14:41:09</span>  <span class="g">hello received</span> · v0.4.1 · harnesses: hermes, claude-code, codex`],
    [3800, null],
  ];
  lines.forEach(([t, ln]) => {
    helloTimer = setTimeout(() => {
      if (ln === null) { finishHello(false); return; }
      const el = $("helloTerm"); if (!el) return;
      const s = document.createElement("span"); s.className = "ln"; s.innerHTML = ln;
      el.appendChild(s); el.scrollTop = el.scrollHeight;
    }, t);
  });
}
function finishHello(fromButton) {
  if (helloTimer) { clearTimeout(helloTimer); helloTimer = null; }
  const c = S.connect; if (!c) return;
  const n = S.extraNodes.find((x) => x._key === c.nodeKey);
  if (n) {
    n.status = "online"; n.version = "0.4.1"; n.lastSeen = "now";
    n.harnesses = ["hermes", "claude-code", "codex"]; n.machine = "Your machine";
  }
  c.step = 4;
  if (S.view === "populated") renderContent();
  renderStats();
  renderConnect();
  if (!fromButton) toast("hello received — node online");
}

function wireCopy(scope) {
  scope.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => {
    copyText(b.dataset.copy);
    b.classList.add("ok");
    const old = b.innerHTML;
    b.innerHTML = "copied";
    setTimeout(() => { b.classList.remove("ok"); b.innerHTML = old; }, 1400);
  });
  const cj = scope.querySelector("#copyJson");
  if (cj && !cj.dataset.wired) {
    cj.dataset.wired = "1";
    cj.onclick = () => { copyText(document.querySelectorAll("#modalBody pre")[1].innerText); toast("node.json copied"); };
  }
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(() => {});
  toast("Copied to clipboard");
}
let toastTimer = null;
function toast(msg) {
  $("toastMsg").textContent = msg;
  $("toast").classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1800);
}

/* ── global wiring ─────────────────────────────────────────────────────── */
document.querySelectorAll("#stateseg button").forEach((b) => b.onclick = () => { closeDrawer(); setView(b.dataset.view); });
$("connectBtn").onclick = openConnect;
$("modalClose").onclick = closeConnect;
$("scrim").onclick = closeConnect;
$("hamburger").onclick = () => $("sidebar").classList.toggle("open");
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (S.connect) return closeConnect();
    if (S.panel) return closeDrawer();
    $("sidebar").classList.remove("open");
  }
  if ((e.key === "c" || e.key === "C") && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const t = document.activeElement;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    if (S.connect) return;
    e.preventDefault(); openConnect();
  }
  if (e.key === "Enter" && S.panel && S.panel.t === "run") { /* noop */ }
});
/* lease countdown for the running task drawer */
setInterval(() => {
  S.lease = S.lease <= 1 ? 42 : S.lease - 1;
  const el = $("leaseV");
  if (el) { el.textContent = S.lease + "s"; el.className = S.lease < 15 ? "lease-low" : "lease-ok"; }
}, 1000);

/* hash deep links: #view=populated #node=<id> #run=<task> — used by screenshots */
(function () {
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  const v = p.get("view");
  if (v && ["populated", "empty", "loading", "error"].includes(v)) setView(v);
  else { renderStats(); renderContent(); } /* initial render */
  const run = p.get("run");
  const node = p.get("node");
  const connect = p.get("connect");
  if (run) { setTimeout(() => openRun(run), 80); }
  else if (node) { setTimeout(() => openNode(node), 80); }
  if (connect) {
    setTimeout(() => {
      openConnect();
      if (connect === "2") { /* step 2: token + snippets */
        S.connect.name = "vault-x1"; S.connect.step = 2; renderConnect();
      }
      if (connect === "3") { /* step 3: waiting for hello */
        S.connect.name = "vault-x1"; S.connect.step = 3; renderConnect();
        setTimeout(() => { const t = $("helloTerm"); if (t) { const s = document.createElement("span"); s.className = "ln"; s.innerHTML = '<span class="t">14:41:02</span>  node registered · <span class="a">vault-x1</span> · token hashed (sha256)<br><span class="t">14:41:05</span>  listening for hello · long-poll /v1/node/claim (waitMs 30000)'; t.appendChild(s); } }, 100);
      }
    }, 120);
  }
})();
</script>
</body>
</html>
