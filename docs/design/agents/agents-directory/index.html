<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents · Neb Labs — Stellarc</title>
<style>
/* ── local fonts (downloaded beside this file) ────────────────────────── */
@font-face {
  font-family: "Cal Sans UI";
  src: url("./fonts/CalSansUI[wght,GEOM]-s.p.c2e3469d.woff2") format("woff2");
  font-display: swap; font-style: normal; font-weight: 300 700;
}
@font-face {
  font-family: "Cal Sans Heading";
  src: url("./fonts/CalSans-SemiBold.woff2") format("woff2");
  font-display: swap; font-style: normal; font-weight: 600;
}
@font-face {
  font-family: "Paper Mono";
  src: url("./fonts/PaperMono-Regular.woff2") format("woff2");
  font-display: swap; font-style: normal; font-weight: 400;
}
/* ── Stellarc v2 tokens (from apps/stellarc-ui/src/index.css) ─────────── */
:root {
  --font-sans: "Cal Sans UI", ui-sans-serif, system-ui, sans-serif;
  --font-heading: "Cal Sans Heading", var(--font-sans);
  --font-mono: "Paper Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --radius: 0.625rem;
  --accent: rgba(0,0,0,.06); --accent-foreground: #171719;
  --background: #f6f6f7; --border: #e2e2e5;
  --card: #ffffff; --card-foreground: #171719;
  --destructive: #fca5a5; --destructive-foreground: #b91c1c;
  --foreground: #171719;
  --info: #3b82f6; --info-foreground: #1d4ed8;
  --input: rgba(0,0,0,.10); --muted: rgba(0,0,0,.04); --muted-foreground: #5d5d60;
  --popover: #ffffff; --popover-foreground: #171719;
  --primary: #2a2a2e; --primary-foreground: #ffffff;
  --ring: #a3a3a3;
  --secondary: rgba(0,0,0,.04); --secondary-foreground: #171719;
  --success: #86efac; --success-foreground: #15803d;
  --warning: #fcd34d; --warning-foreground: #a16207;
  --sidebar: #ffffff; --sidebar-foreground: #5d5d60;
  --sidebar-primary: #2a2a2e; --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: rgba(0,0,0,.04); --sidebar-accent-foreground: #171719;
  --sidebar-border: #e2e2e5;
  --code: #ffffff;
  color-scheme: light;
}
.dark {
  --accent: rgba(255,255,255,.06); --accent-foreground: #e6e6e6;
  --background: #0a0a0b; --border: #262629;
  --card: #131315; --card-foreground: #e6e6e6;
  --destructive: #fca5a5; --destructive-foreground: #fca5a5;
  --foreground: #e6e6e6;
  --info: #3b82f6; --info-foreground: #60a5fa;
  --input: rgba(255,255,255,.08); --muted: rgba(255,255,255,.04); --muted-foreground: #999a9c;
  --popover: #131315; --popover-foreground: #e6e6e6;
  --primary: #c9c9c9; --primary-foreground: #0a0a0b;
  --ring: #71717a;
  --secondary: rgba(255,255,255,.04); --secondary-foreground: #e6e6e6;
  --success: #86efac; --success-foreground: #86efac;
  --warning: #fcd34d; --warning-foreground: #fcd34d;
  --sidebar: #131315; --sidebar-foreground: #999a9c;
  --sidebar-primary: #c9c9c9; --sidebar-primary-foreground: #0a0a0b;
  --sidebar-accent: rgba(255,255,255,.04); --sidebar-accent-foreground: #e6e6e6;
  --sidebar-border: #262629;
  --code: color-mix(in srgb, #0a0a0b 98%, #fff);
  color-scheme: dark;
}

/* ── base ─────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--background); color: var(--foreground);
  font-family: var(--font-sans); font-size: 13px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { font-family: var(--font-heading); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
.mono { font-family: var(--font-mono); }
.dim { color: var(--muted-foreground); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; border-radius: 4px; }
::selection { background: color-mix(in srgb, var(--primary) 30%, transparent); }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

@keyframes skeleton { to { background-position: -200% 0; } }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes blink { 50% { opacity: .25; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── buttons / badges / inputs ────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 11px; border-radius: calc(var(--radius) - 2px);
  border: 1px solid transparent; background: transparent; color: var(--foreground);
  font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
}
.btn svg { width: 14px; height: 14px; }
.btn:active { transform: translateY(0.5px); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { background: color-mix(in srgb, var(--primary) 88%, transparent); }
.btn-outline { border-color: var(--input); background: var(--popover); }
.btn-outline:hover { background: color-mix(in srgb, var(--accent) 60%, transparent); }
.btn-ghost:hover { background: var(--accent); }
.btn-danger { border-color: color-mix(in srgb, var(--destructive) 32%, transparent); color: var(--destructive-foreground); background: var(--popover); }
.btn-danger:hover { background: color-mix(in srgb, var(--destructive) 8%, transparent); }
.btn-xs { height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: calc(var(--radius) - 4px); gap: 5px; }
.btn-xs svg { width: 12px; height: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: calc(var(--radius) - 3px);
  border: none; background: transparent; color: var(--muted-foreground); cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.iconbtn:hover { background: var(--accent); color: var(--foreground); }
.iconbtn svg { width: 15px; height: 15px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 7px;
  border-radius: 5px; font-size: 11px; font-weight: 500; line-height: 1;
  border: 1px solid transparent; white-space: nowrap;
}
.badge svg { width: 11px; height: 11px; }
.badge.success { background: color-mix(in srgb, var(--success) 8%, transparent); color: var(--success-foreground); }
.badge.warning { background: color-mix(in srgb, var(--warning) 8%, transparent); color: var(--warning-foreground); }
.badge.error   { background: color-mix(in srgb, var(--destructive) 10%, transparent); color: var(--destructive-foreground); }
.badge.info    { background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info-foreground); }
.badge.secondary { background: var(--secondary); color: var(--muted-foreground); }
.badge.outline { border-color: var(--input); color: var(--muted-foreground); background: var(--popover); }

.dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; flex: none; }
.dot.ok { background: var(--success); }
.dot.err { background: var(--destructive); }
.dot.warn { background: var(--warning); }
.dot.idle { background: var(--muted-foreground); }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }

.avatar {
  width: 28px; height: 28px; border-radius: 7px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--primary); color: var(--primary-foreground);
  font-size: 11px; font-weight: 600; letter-spacing: 0;
}
.avatar.xs { width: 20px; height: 20px; border-radius: 5px; font-size: 9px; }
.avatar.lg { width: 40px; height: 40px; border-radius: 10px; font-size: 15px; font-family: var(--font-heading); }
.avatar.soft { background: var(--secondary); color: var(--foreground); border: 1px solid var(--input); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }

.input, .textarea {
  width: 100%; background: var(--popover); color: var(--foreground);
  border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px);
  font-size: 12.5px; font-family: inherit; padding: 0 10px; height: 30px;
  transition: border-color .12s ease, box-shadow .12s ease;
}
.textarea { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.input:focus, .textarea:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 25%, transparent); }
.input::placeholder, .textarea::placeholder { color: var(--muted-foreground); }

.kbd {
  font-family: var(--font-mono); font-size: 10px; line-height: 1;
  padding: 3px 5px; border-radius: 4px; border: 1px solid var(--input);
  background: var(--secondary); color: var(--muted-foreground); white-space: nowrap;
}
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px;
  border-radius: 5px; background: var(--secondary); border: 1px solid transparent;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); white-space: nowrap;
}
.ticket-chip {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground);
  border: 1px solid var(--input); border-radius: 4px; padding: 1px 5px; white-space: nowrap;
}

.skel {
  border-radius: 6px;
  background-color: color-mix(in srgb, var(--foreground) 5%, transparent);
  background-image: linear-gradient(90deg, transparent, color-mix(in srgb, var(--foreground) 7%, transparent), transparent);
  background-size: 200% 100%;
  animation: skeleton 2s -1s infinite linear;
}

.alert {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--card);
  font-size: 12.5px;
}
.alert svg { width: 15px; height: 15px; flex: none; margin-top: 1px; }
.alert.err { border-color: color-mix(in srgb, var(--destructive) 35%, transparent); background: color-mix(in srgb, var(--destructive) 5%, transparent); }
.alert.err svg { color: var(--destructive-foreground); }
.alert.warn { border-color: color-mix(in srgb, var(--warning) 35%, transparent); background: color-mix(in srgb, var(--warning) 5%, transparent); }
.alert.warn svg { color: var(--warning-foreground); }

/* ── app shell ────────────────────────────────────────────────────────── */
.app { display: flex; min-height: 100vh; }
.sb {
  width: 240px; flex: none; display: flex; flex-direction: column;
  background: var(--sidebar); border-radius: 12px;
  margin: 6px 0 6px 6px; position: sticky; top: 6px; height: calc(100vh - 12px);
  z-index: 40;
}
.sb-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; }
.orgpill {
  display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0;
  height: 28px; padding: 0 7px; border-radius: 7px; border: none; cursor: pointer;
  background: transparent; color: var(--foreground); font-size: 12.5px; font-weight: 600;
}
.orgpill:hover { background: var(--sidebar-accent); }
.orgpill .chev { margin-left: auto; color: var(--muted-foreground); }
.orgpill .chev svg { width: 13px; height: 13px; }
.sb-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.sb-search {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 7px;
  border-radius: 7px; border: none; background: transparent; cursor: pointer;
  color: var(--muted-foreground); font-size: 12.5px; margin: 2px 0 6px;
}
.sb-search:hover { background: var(--sidebar-accent); color: var(--foreground); }
.sb-search svg { width: 14px; height: 14px; }
.sb-search .kbd { margin-left: auto; }
.navitem {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 7px;
  border-radius: 7px; border: none; background: transparent; cursor: pointer;
  color: var(--sidebar-foreground); font-size: 12.5px; font-weight: 500; text-align: left;
}
.navitem:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.navitem.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.navitem svg { width: 15px; height: 15px; flex: none; opacity: .85; }
.navitem .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navbadge {
  font-family: var(--font-mono); font-size: 10px; line-height: 1;
  background: var(--secondary); color: var(--muted-foreground);
  border-radius: 999px; padding: 3px 6px;
}
.sb-div { height: 1px; background: var(--sidebar-border); margin: 7px 6px; }
.sb-label {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted-foreground); padding: 8px 8px 3px;
}
.sb-foot {
  display: flex; align-items: center; gap: 8px; padding: 10px; border-top: 1px solid var(--sidebar-border);
}
.sb-foot .who { flex: 1; min-width: 0; }
.sb-foot .who .n { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-foot .who .e { font-size: 10.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-foot .ver { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-foreground); }
.sb-scrim { display: none; }

.main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  margin: 6px; border-radius: 12px; background: var(--background);
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.pagehead {
  height: 40px; flex: none; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; border-bottom: 1px solid var(--border);
  background: var(--card); border-radius: 12px 12px 0 0;
}
.crumbs { display: flex; align-items: center; gap: 5px; min-width: 0; font-size: 12px; }
.crumbs .crumb { color: var(--card-foreground); white-space: nowrap; }
.crumbs .crumb.muted { color: var(--muted-foreground); }
.crumbs .crumb.link { cursor: pointer; }
.crumbs .crumb.link:hover { text-decoration: underline; }
.crumbs svg { width: 12px; height: 12px; color: var(--muted-foreground); }
.crumbs .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabgroup {
  display: inline-flex; align-items: center; gap: 2px; height: 28px; margin-left: 10px;
  padding: 2px; border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  border-radius: 8px; background: var(--background);
}
.tab {
  height: 22px; padding: 0 9px; border-radius: 6px; border: none; cursor: pointer;
  background: transparent; color: var(--muted-foreground); font-size: 11.5px; font-weight: 500;
}
.tab:hover { color: var(--foreground); }
.tab.active { background: var(--secondary); color: var(--secondary-foreground); }
.head-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.content { flex: 1; min-width: 0; width: 100%; max-width: 1060px; margin: 0 auto; padding: 20px 24px 56px; }

/* ── state switcher (mock control) ─────────────────────────────────────── */
.statebar {
  position: fixed; right: 14px; bottom: 14px; z-index: 80;
  display: flex; align-items: center; gap: 8px; padding: 5px 7px;
  background: var(--popover); border: 1px solid var(--border); border-radius: 9px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: 10.5px;
}
.statebar .lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; color: var(--muted-foreground); padding: 0 2px; }
.seg { display: inline-flex; gap: 2px; background: var(--secondary); border-radius: 6px; padding: 2px; }
.seg-btn {
  height: 20px; padding: 0 8px; border-radius: 5px; border: none; cursor: pointer;
  background: transparent; color: var(--muted-foreground); font-size: 10.5px; font-weight: 500;
}
.seg-btn:hover { color: var(--foreground); }
.seg-btn.active { background: var(--popover); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.statebar .okdot { width: 6px; height: 6px; border-radius: 999px; background: var(--success); margin: 0 2px; }

/* ── directory ────────────────────────────────────────────────────────── */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.search { position: relative; width: 230px; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted-foreground); pointer-events: none; }
.search .input { padding-left: 28px; }
.fchip {
  height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--input);
  background: var(--popover); color: var(--muted-foreground); font-size: 11.5px; font-weight: 500; cursor: pointer;
}
.fchip:hover { color: var(--foreground); }
.fchip.active { background: var(--secondary); border-color: transparent; color: var(--foreground); }
.fchip .cnt { font-family: var(--font-mono); font-size: 10px; opacity: .75; margin-left: 4px; }
.vtoggle { display: inline-flex; border: 1px solid var(--input); border-radius: 7px; overflow: hidden; margin-left: auto; }
.vtoggle button { width: 28px; height: 26px; border: none; background: var(--popover); color: var(--muted-foreground); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.vtoggle button svg { width: 13px; height: 13px; }
.vtoggle button.active { background: var(--secondary); color: var(--foreground); }

.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.acard {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 13px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
  transition: border-color .12s ease, transform .12s ease, background .12s ease;
  animation: rise .18s ease both;
}
.acard:hover { border-color: color-mix(in srgb, var(--foreground) 22%, var(--border)); transform: translateY(-1px); }
.acard-head { display: flex; align-items: center; gap: 9px; }
.acard-name { font-size: 13.5px; font-weight: 600; font-family: var(--font-heading); letter-spacing: -0.01em; }
.acard-head .badge { margin-left: auto; }
.acard-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.acard-node { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
.acard-task {
  border-top: 1px solid var(--border); padding-top: 9px; margin-top: 1px;
  display: flex; flex-direction: column; gap: 4px; min-height: 44px;
}
.acard-task .t { font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.acard-foot { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); }
.acard-foot .sep { opacity: .5; }
.acard-foot .owner { margin-left: auto; display: flex; align-items: center; gap: 5px; }

.atablewrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
.atable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.atable th {
  text-align: left; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted-foreground); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border);
  background: var(--card); white-space: nowrap;
}
.atable td { padding: 9px 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); vertical-align: middle; white-space: nowrap; }
.atable tr:last-child td { border-bottom: none; }
.atable tbody tr { cursor: pointer; }
.atable tbody tr:hover { background: var(--accent); }
.atable .agentcell { display: flex; align-items: center; gap: 9px; }
.atable .agentcell .sub { font-size: 10.5px; color: var(--muted-foreground); font-family: var(--font-mono); }
.atable .taskcell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.atable .num { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-foreground); }

/* ── empty / loading ──────────────────────────────────────────────────── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 72px 24px; gap: 14px; }
.empty-media {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--foreground);
  display: flex; align-items: center; justify-content: center;
}
.empty-media svg { width: 19px; height: 19px; opacity: .8; }
.empty-title { font-size: 14px; font-weight: 600; font-family: var(--font-heading); }
.empty-msg { font-size: 12.5px; color: var(--muted-foreground); max-width: 380px; line-height: 1.55; }
.empty-cta { display: flex; gap: 8px; margin-top: 4px; }

.loadwrap { display: flex; flex-direction: column; gap: 12px; }
.load-toolbar { display: flex; gap: 8px; }
.load-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.load-card { border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--card); }

/* ── profile ──────────────────────────────────────────────────────────── */
.backlink { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted-foreground); cursor: pointer; background: none; border: none; padding: 0; }
.backlink:hover { color: var(--foreground); text-decoration: underline; }
.backlink svg { width: 13px; height: 13px; }
.prof-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }

.tr-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 0 0; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); max-width: 780px; }

.nodecard { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }

/* ── dialogs ──────────────────────────────────────────────────────────── */
.overlay {

}

.dialog {

}

.nodecard-sel {

}

.field { margin-bottom: 12px; }

.tokenline {

  background: color-mix(in srgb, var(--warning) 5%, transparent);
  border-radius: 8px; padding: 9px 11px; font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere;

/* ── palette ──────────────────────────────────────────────────────────── */
.palette { width: min(560px, 100%); background: var(--popover); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.55); animation: rise .14s ease both; overflow: hidden; }
.pal-input { width: 100%; height: 42px; border: none; border-bottom: 1px solid var(--border); background: transparent; color: var(--foreground); font-size: 13.5px; padding: 0 14px; font-family: inherit; }

.pal-list { max-height: 320px; overflow-y: auto; padding: 6px; }
.pal-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 12.5px; }

.pal-item.sel { background: var(--accent); }
.pal-empty { padding: 18px; text-align: center; color: var(--muted-foreground); font-size: 12px; }

/* ── toast ────────────────────────────────────────────────────────────── */
.toastwrap { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 9px;
  background: var(--popover); border: 1px solid var(--border); box-shadow: 0 10px 32px rgba(0,0,0,.5);

}

@media (max-width: 820px) {

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

"use strict";
/* ════════════════════════════════════════════════════════════════════════

   Plain JS, no build. Data mirrors packages/agents/src/protocol.ts

const ICONS = {

  setTimeout(() => { el.style.transition = 'opacity .2s ease'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 2600);
}

/* ── transcript rendering (ADR-0003 item kinds) ─────────────────────── */
function renderTranscript(items){
  const out = [];
  for (const it of items){
    const k = it.kind;
    if (k === 'message'){
      const isUser = it.role === 'user';
      out.push('<div class="titem '+(isUser?'msg-user':'msg-ai')+'">'
        +'<div class="ti-head">'+icon('message')+'<span class="ti-kind">'+esc(it.role)+'</span>'
        +(it.meta==='streaming' ? '<span class="streaming-tag">● streaming</span>' : '')
        +'<span class="ti-meta">'+esc(it.meta||'')+'</span></div>'
        +'<div class="ti-body">'+(isUser?'<div class="msg-role">prompt</div>':'')+esc(it.body)+'</div></div>');
    } else if (k === 'thinking'){
      out.push('<div class="titem think"><details open><summary>'+icon('brain')
        +'<span class="ti-kind">thinking</span><span style="margin-left:auto" class="ti-meta">expand</span>'
        +'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></summary>'
        +'<div class="full">'+esc(it.body)+'</div></details></div>');
    } else if (k === 'tool_call'){
      out.push('<div class="titem tool-in"><div class="ti-head">'+icon('wrench')
        +'<span class="ti-title">'+esc(it.title)+'</span><span class="ti-meta">'+esc(it.meta||'')+'</span></div></div>');
    } else if (k === 'tool_result'){
      out.push('<div class="titem tool-out'+(it.status==='err'?' err':'')+'"><div class="ti-head">'+icon('terminal')
        +'<span class="ti-kind">result · '+esc(it.status)+'</span><span class="ti-meta">'+(it.status==='err'?'exit 1':'exit 0')+'</span></div>'
        +'<pre class="codeblock">'+esc(it.out)+'</pre></div>');
    } else if (k === 'file_change'){
      const lines = it.diff.split('\n').map(l =>
        l.startsWith('+') ? '<span class="diffline add">'+esc(l)+'</span>'
        : l.startsWith('-') ? '<span class="diffline del">'+esc(l)+'</span>'
        : '<span class="diffline ctx">'+esc(l)+'</span>').join('');
      out.push('<div class="titem tool-in"><div class="ti-head">'+icon('file-diff')
        +'<span class="ti-kind">file_change</span><span class="ti-title" style="margin-left:2px">'+esc(it.path)+'</span>'
        +'<span class="ti-meta fc-stats"><span class="a">+'+it.add+'</span><span class="d">−'+it.del+'</span></span></div>'
        +'<pre class="codeblock tall">'+lines+'</pre></div>');
    } else if (k === 'config'){
      const kv = Object.entries(it.kv).map(([K,V]) =>
        '<div><div class="k">'+esc(K)+'</div><div class="v">'+esc(V)+'</div></div>').join('');
      out.push('<div class="titem meta-item"><div class="ti-head">'+icon('cpu')
        +'<span class="ti-kind">config</span></div><div class="ti-body"><div class="cfg-grid">'+kv+'</div></div></div>');
    } else if (k === 'checkpoint'){
      out.push('<div class="titem ckpt"><div class="ti-head">'+icon('history')
        +'<span class="ti-kind">checkpoint</span></div><div class="ti-body">'+esc(it.body)
        +' <span class="mono" style="font-size:11px">'+esc(it.tokensBefore)+' tokens · retained: '+esc(it.retained)+'</span></div></div>');
    } else { /* harness_meta */
      out.push('<div class="titem meta-item"><div class="ti-head">'+icon('alert')
        +'<span class="ti-kind">harness_meta</span></div><div class="ti-body">'+esc(it.body)+'</div></div>');
    }
  }
  return out.join('');
}

        +'<td><span class="badge '+cls+'">'+lb+'</span></td><td>'+(t.subjectRef?'<span class="ticket-chip">'+esc(t.subjectRef)+'</span>':'<span class="dim">—</span>')+'</td>'

        +'<td>'+(t.failureCode?'<span class="mono" style="font-size:10.5px;color:var(--destructive-foreground)">'+esc(t.failureCode)+'</span>':'<span class="dim">—</span>')+'</td></tr>'; }).join('')
      + '</tbody></table></div>';
  } else if (profState.tab === 'tickets'){
    const withRef = runs.filter(t => t.subjectRef);
    body = withRef.length
      ? '<div class="atablewrap"><table class="atable"><thead><tr><th>Ticket</th><th>Task</th><th>Status</th><th>Elapsed</th></tr></thead><tbody>'
        + withRef.map(t => { const [cls,lb] = taskBadge(t);
          return '<tr data-action="task" data-task="'+t.id+'"><td><span class="ticket-chip">'+esc(t.subjectRef)+'</span></td><td><div class="taskcell" style="max-width:420px;white-space:normal">'+esc(t.title)+'</div></td><td><span class="badge '+cls+'">'+lb+'</span></td><td class="num">'+esc(t.elapsed)+'</td></tr>'; }).join('')
        + '</tbody></table></div><div class="field-hint" style="margin-top:8px">Bound via <span class="mono">subjectRef</span> when the agent is assigned a ticket — status and transcript render on the ticket.</div>'
      : '<div class="empty"><div class="empty-media">'+icon('kanban')+'</div><div class="empty-title">No tickets bound</div><div class="empty-msg">This agent has no runs with a <span class="mono">subjectRef</span>. Assign it a ticket to see the binding here.</div></div>';
  } else if (profState.tab === 'transcript'){
    body = transcriptViewHTML(a, profState.task ? TASKS.find(t => t.id === profState.task) : cur);
  }
  return head + stats + tabs + body;

    const banner = failed
      ? '<div class="tr-banner fail">'+icon('x-circle')+'<div><div style="font-weight:600">Task '+esc(cur.status)+' — <span class="code">'+esc(cur.failureCode||cur.stopReason||'')+'</span></div><div class="sub">'+esc(cur.failureMessage||'')+'</div></div></div>'
      : '<div class="tr-banner live">'+icon('check-circle')+'<div><div style="font-weight:600">'+(cur.status==='running'?'Running':'Completed')+' — attempt '+cur.attempt+'/'+cur.maxAttempts+(cur.status==='running'?' · '+esc(cur.elapsed)+' elapsed':'')+'</div><div class="sub">'+(cur.status==='running'?'lease renews every 20s · node '+esc(nodeLabel(a.nodeId))+' claims this attempt':'items folded from ACP session/update — dedup on (task, attempt, seq)')+'</div></div></div>';
    return '<div class="tr-head"><span class="title">'+esc(cur.title)+'</span>'+(cur.subjectRef?'<span class="ticket-chip">'+esc(cur.subjectRef)+'</span>':'')
      +'<span class="meta">'+cur.id+' · attempt '+cur.attempt+'/'+cur.maxAttempts+'</span>'
      +(cur.status==='running'||cur.status==='claimed' ? '<button class="btn btn-danger btn-xs" style="margin-left:auto" data-action="cancel-task" data-task="'+cur.id+'">'+icon('x')+'Cancel</button>' : '')+'</div>'
      + banner + '<div class="titems">'+renderTranscript(items)+'</div>'
      + '<div class="tr-foot"><span>seq 0–'+(items.length-1)+'</span><span>·</span><span>dedup on (task, attempt, seq)</span><span class="right">raw wire stays on '+esc(nodeLabel(a.nodeId))+' (D21)</span></div>';
  }
  /* no task selected: fall back to any recorded transcript, else empty state */
  const done = tasksOf(a.id).find(t => TRANSCRIPTS[t.id]);
  if (!done) return '<div class="empty"><div class="empty-media">'+icon('terminal')+'</div><div class="empty-title">No transcript yet</div><div class="empty-msg">Transcript items appear here as the agent works. Nothing has been recorded for '+esc(a.name)+'.</div></div>';
  return transcriptViewHTML(a, done);
}

/* ── router ─────────────────────────────────────────────────────────── */
const STATES = ['populated','loading','empty','error'];
let mockState = 'populated';
let route = { page:'directory' }; /* {page:'directory'|'runtimes'} | {page:'profile', id, tab} */

function parseHash(){
  const h = (location.hash || '#/agents').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'runtimes') return { page:'runtimes' };
  if (parts[0] === 'agents' && parts[1] && agentById(parts[1])){
    if (parts[2] && ['overview','runs','tickets','transcript'].includes(parts[2])) profState.tab = parts[2];
    return { page:'profile', id:parts[1], tab:profState.tab };
  }
  return { page:'directory' };
}

function render(){
  route = parseHash();
  /* chrome */
  const crumbs = $('#crumbs'), tabs = $('#tabgroup'), actions = $('#headActions');
  if (route.page === 'profile'){
    const a = agentById(route.id);
    crumbs.innerHTML = '<span class="crumb muted org">Neb Labs</span>'+icon('chevron-right')
      +'<span class="crumb link" data-action="go" data-hash="#/agents">Agents</span>'+icon('chevron-right')
      +'<span class="crumb truncate">'+esc(a.name)+'</span>';
    tabs.innerHTML = '';
    actions.innerHTML = '<button class="btn btn-primary btn-xs" data-action="wizard">'+icon('plus')+'New agent</button>';
  } else {
    crumbs.innerHTML = '<span class="crumb muted org">Neb Labs</span>'+icon('chevron-right')
      +'<span class="crumb">'+(route.page==='runtimes'?'Runtimes':'Agents')+'</span>';
    tabs.innerHTML = [['agents','Agents'],['runtimes','Runtimes']].map(([k,l]) =>
      '<button class="tab'+((route.page==='directory'&&k==='agents')||(route.page==='runtimes'&&k==='runtimes')?' active':'')+'" data-action="go" data-hash="#/'+k+'">'+l+'</button>').join('');
    actions.innerHTML = (route.page==='runtimes'
      ? '<button class="btn btn-outline btn-xs" data-action="register">'+icon('server')+'Register runtime</button>'
      : '<button class="btn btn-primary btn-xs" data-action="wizard">'+icon('plus')+'New agent</button>');
  }
  /* nav highlight */
  $$('.navitem').forEach(n => n.classList.toggle('active', n.dataset.hash === '#/'+(route.page==='runtimes'?'runtimes':'agents')));
  /* content */
  const c = $('#content');
  if (route.page === 'profile'){
    c.innerHTML = profileHTML(agentById(route.id));
  } else if (route.page === 'runtimes'){
    c.innerHTML = mockState==='loading' ? directoryLoadingHTML() : runtimesHTML();
  } else {
    c.innerHTML = ({ populated:directoryHTML, loading:directoryLoadingHTML, empty:directoryEmptyHTML, error:directoryErrorHTML })[mockState]();
  }
  /* re-focus search */
  const s = $('#dirSearch');
  if (s){ s.oninput = e => { dirState.q = e.target.value; const pos=e.target.selectionStart; render(); const s2=$('#dirSearch'); if(s2){ s2.focus(); s2.setSelectionRange(pos,pos); } }; }
  $$('#stateSeg .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.s === mockState));
}

function setStateBar(){
  $('#stateSeg').innerHTML = STATES.map(s => '<button class="seg-btn'+(s===mockState?' active':'')+'" data-action="mock-state" data-s="'+s+'">'+s+'</button>').join('');
}

/* ── event delegation ───────────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const act = t.dataset.action;
  const overlayClose = () => { $$('.overlay').forEach(o => o.classList.remove('open')); };
  switch (act){
    case 'go': location.hash = t.dataset.hash; overlayClose(); closeSb(); break;
    case 'toast': toast(t.dataset.toast || 'Outside this mockup'); break;
    case 'toggle-sb': $('#sidebar').classList.toggle('open'); $('#sbScrim').classList.toggle('show'); break;
    case 'theme': {
      const el = document.documentElement;
      el.classList.toggle('dark');
      el.classList.toggle('light');
      const hasDark = el.classList.contains('dark');
      if (hasDark && !$('.sb .theme-ic')) {} /* noop */
      t.innerHTML = icon(hasDark ? 'sun' : 'moon');
      break;
    }
    case 'mock-state': mockState = t.dataset.s; render(); break;
    case 'filter': dirState.f = t.dataset.f; render(); break;
    case 'view': dirState.view = t.dataset.v; render(); break;
    case 'clear-filters': dirState = { view:dirState.view, q:'', f:'all' }; render(); break;
    case 'retry': mockState = 'loading'; render(); setTimeout(() => { mockState = 'populated'; render(); toast('Agents loaded'); }, 900); break;
    case 'ptab': profState.tab = t.dataset.tab; if (profState.tab !== 'transcript') profState.task = null; render(); break;
    case 'task': {
      const task = TASKS.find(x => x.id === t.dataset.task);
      if (!task) break;
      const a = agentById(task.agentId);
      profState.tab = 'transcript';
      profState.task = task.id;
      if (route.page === 'profile' && route.id === a.id) render();
      else location.hash = '#/agents/' + a.id; /* hashchange → render() */
      break;
    }
    case 'cancel-task': { const task = TASKS.find(x => x.id === t.dataset.task); if (task){ task.status = 'cancelled'; render(); toast('Cancel sent — node learns on next heartbeat'); } break; }
    case 'wizard': wiz = { step:1, node:t.dataset.node||null, harness:null, model:'', name:'', instructions:'', mcp:'github' }; if (wiz.node) wiz.step = 2; $('#wizardOverlay').innerHTML = wizardHTML(); $('#wizardOverlay').classList.add('open'); hydrateIcons($('#wizardOverlay')); break;
    case 'close-wizard': overlayClose(); break;
    case 'wiz-node': wiz.node = t.dataset.node; wiz.step = 2; $('#wizardOverlay').innerHTML = wizardHTML(); hydrateIcons($('#wizardOverlay')); break;
    case 'wiz-harness': wiz.harness = t.dataset.h; wiz.step = 3; $('#wizardOverlay').innerHTML = wizardHTML(); hydrateIcons($('#wizardOverlay')); break;
    case 'wiz-mcp': wiz.mcp = t.dataset.m; $('#wizardOverlay').innerHTML = wizardHTML(); hydrateIcons($('#wizardOverlay')); break;
    case 'wiz-next': {
      if (wiz.step === 3){ wiz.name = ($('#wizName')||{}).value || ''; wiz.model = ($('#wizModel')||{}).value || ''; }
      if (wiz.step === 4){ wiz.instructions = ($('#wizInstr')||{}).value || ''; }
      wiz.step = Math.min(4, wiz.step + 1);
      $('#wizardOverlay').innerHTML = wizardHTML(); hydrateIcons($('#wizardOverlay')); break;
    }
    case 'wiz-back': wiz.step = Math.max(1, wiz.step - 1); $('#wizardOverlay').innerHTML = wizardHTML(); hydrateIcons($('#wizardOverlay')); break;
    case 'wiz-create': {
      wiz.instructions = ($('#wizInstr')||{}).value || '';
      const id = 'agt_'+wiz.name;
      AGENTS.push({ id, name:wiz.name, harness:wiz.harness, model:wiz.model||null, nodeId:wiz.node, owner:'Raisal W.', created:'just now',
        instructions:wiz.instructions || 'No instructions set.', mcp: wiz.mcp==='none'?[]:[{name:wiz.mcp, cmd:'mcp-server-'+wiz.mcp, args:[]}],
        skills:['new-agent'], runs:0, ok:0, failed:0, cancelled:0, tokens:0, cost:0, avgMs:0 });
      overlayClose(); toast('Agent “'+wiz.name+'” created on '+nodeLabel(wiz.node));
      location.hash = '#/agents/'+id; profState.tab = 'overview'; render(); break;
    }
    case 'runtask': {
      const a = route.page==='profile' ? agentById(route.id) : null;
      if (a){ $('#runtaskOverlay').innerHTML = runtaskHTML(a); $('#runtaskOverlay').classList.add('open'); hydrateIcons($('#runtaskOverlay')); }
      break;
    }
    case 'close-runtask': overlayClose(); break;
    case 'dispatch-task': {
      const a = agentById(route.id);
      TASKS.unshift({ id:'tsk_'+Math.random().toString(16).slice(2,6), agentId:a.id, status:'queued', subjectRef:($('#rtSubject')||{}).value||null, title:(($('#rtPrompt')||{}).value||'Custom task').slice(0,60), attempt:0, maxAttempts:3, elapsed:'—', prompt:'' });
      overlayClose(); toast('Task queued for '+a.name); profState.tab='runs'; render(); break;
    }
    case 'register': $('#registerOverlay').innerHTML = registerHTML(); $('#registerOverlay').classList.add('open'); hydrateIcons($('#registerOverlay')); break;
    case 'close-register': overlayClose(); break;
    case 'node-registered': {
      NODES.push({ id:'node_'+Math.random().toString(16).slice(2,8), name:'talon-2', host:'awaiting hello', version:'—', harnesses:[], lastSeen:'never', online:false });
      overlayClose(); toast('Node registered — waiting for first hello'); if(route.page!=='runtimes') location.hash='#/runtimes'; render(); break;
    }
    case 'palette': $('#paletteOverlay').innerHTML = paletteHTML(); $('#paletteOverlay').classList.add('open'); hydrateIcons($('#paletteOverlay')); const pi = $('#palInput'); if (pi){ pi.focus(); pi.oninput = () => { const q = pi.value.toLowerCase(); $$('#palList .pal-item').forEach(it => { it.style.display = it.textContent.toLowerCase().includes(q) ? '' : 'none'; }); }; } break;
  }
  if (t.dataset.closePal){ overlayClose(); }
});
function closeSb(){ if (window.innerWidth <= 820){ $('#sidebar').classList.remove('open'); $('#sbScrim').classList.remove('show'); } }

/* keyboard */
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#paletteOverlay').innerHTML = paletteHTML(); $('#paletteOverlay').classList.add('open'); hydrateIcons($('#paletteOverlay')); const pi = $('#palInput'); if (pi){ pi.focus(); pi.oninput = () => { const q = pi.value.toLowerCase(); $$('#palList .pal-item').forEach(it => { it.style.display = it.textContent.toLowerCase().includes(q) ? '' : 'none'; }); }; } }
  if (e.key === 'Escape') $$('.overlay').forEach(o => o.classList.remove('open'));
  if (e.key === 'Enter'){ const t = e.target.closest('[data-action="go"], [data-action="task"]'); if (t) t.click(); }
});
$$('.overlay').forEach(o => o.addEventListener('click', (e) => { if (e.target === o) o.classList.remove('open'); }));

/* boot */
setStateBar();
hydrateIcons(document);
/* screenshot deep-link params: ?state=loading|empty|error, ?dialog=wizard|register|runtask, ?task=tsk_x */
(() => {
  const p = new URLSearchParams(location.search);
  if (p.has('state') && STATES.includes(p.get('state'))) mockState = p.get('state');
  if (p.has('task')) profState.task = p.get('task');
  if (p.has('tab')) profState.tab = p.get('tab');
  if (p.has('dialog')){
    const d = p.get('dialog');
    if (d === 'wizard'){ wiz = { step:1, node:null, harness:null, model:'', name:'', instructions:'', mcp:'github' }; $('#wizardOverlay').innerHTML = wizardHTML(); $('#wizardOverlay').classList.add('open'); hydrateIcons($('#wizardOverlay')); }
    if (d === 'register'){ $('#registerOverlay').innerHTML = registerHTML(); $('#registerOverlay').classList.add('open'); hydrateIcons($('#registerOverlay')); }
  }
})();
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
