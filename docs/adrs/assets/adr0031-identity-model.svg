<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="ui-monospace,Menlo,monospace">
<rect width="920" height="560" fill="#0d1117"/>
<text x="24" y="34" fill="#e6edf3" font-size="17" font-weight="bold">ADR 0031 — tenant node: identity &amp; ownership</text>

<!-- Hall -->
<rect x="24" y="60" width="200" height="88" rx="8" fill="#161b22" stroke="#388bfd"/>
<text x="40" y="88" fill="#79c0ff" font-size="14" font-weight="bold">Hall (control plane)</text>
<text x="40" y="110" fill="#8b949e" font-size="11">schedules fail-closed:</text>
<text x="40" y="126" fill="#8b949e" font-size="11">BYOK / multi-user →</text>
<text x="40" y="140" fill="#8b949e" font-size="11">tenant-tier nodes only</text>

<!-- Node box -->
<rect x="260" y="60" width="636" height="478" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="278" y="86" fill="#e6edf3" font-size="13" font-weight="bold">tenant-tier node</text>
<text x="278" y="102" fill="#8b949e" font-size="11">Hello { tier: tenant }</text>
<line x1="224" y1="104" x2="260" y2="104" stroke="#388bfd" stroke-dasharray="4 3"/>

<!-- Envoy root -->
<rect x="278" y="116" width="290" height="96" rx="8" fill="#161b22" stroke="#f85149"/>
<text x="294" y="140" fill="#ff7b72" font-size="13" font-weight="bold">olympus-envoy  (root)</text>
<text x="294" y="158" fill="#8b949e" font-size="11">ensure_user · ensure_org_group</text>
<text x="294" y="172" fill="#8b949e" font-size="11">spawn_as · set_quota</text>
<text x="294" y="192" fill="#8b949e" font-size="11">systemd-run --uid --gid --slice</text>

<!-- user slices -->
<rect x="278" y="236" width="290" height="128" rx="8" fill="#161b22" stroke="#3fb950"/>
<text x="294" y="260" fill="#7ee787" font-size="12" font-weight="bold">olympus-u-alice.slice  (uid: alice)</text>
<rect x="294" y="272" width="118" height="34" rx="6" fill="#0d1117" stroke="#3fb950"/>
<text x="308" y="293" fill="#e6edf3" font-size="11">session A1</text>
<rect x="422" y="272" width="130" height="34" rx="6" fill="#0d1117" stroke="#3fb950"/>
<text x="432" y="293" fill="#e6edf3" font-size="11">session A2 (bwrap)</text>
<text x="294" y="330" fill="#8b949e" font-size="11">creds: users/alice  (0700)</text>
<text x="294" y="348" fill="#8b949e" font-size="11">cgroup quota + OOM attribution</text>

<rect x="278" y="384" width="290" height="96" rx="8" fill="#161b22" stroke="#3fb950"/>
<text x="294" y="408" fill="#7ee787" font-size="12" font-weight="bold">olympus-u-bob.slice    (uid: bob)</text>
<rect x="294" y="420" width="118" height="34" rx="6" fill="#0d1117" stroke="#3fb950"/>
<text x="308" y="441" fill="#e6edf3" font-size="11">session B1</text>
<text x="294" y="472" fill="#8b949e" font-size="11">creds: users/bob  (0700)</text>

<!-- arrows envoy -> slices -->
<path d="M440 212 L440 236" stroke="#f85149" fill="none" marker-end="url(#a)"/>
<path d="M286 212 C268 240 268 356 286 384" stroke="#f85149" fill="none" marker-end="url(#a)"/>

<!-- org tree -->
<rect x="596" y="236" width="282" height="244" rx="8" fill="#161b22" stroke="#d29922"/>
<text x="612" y="260" fill="#e3b341" font-size="12" font-weight="bold">/var/lib/olympus/orgs/acme/</text>
<text x="612" y="280" fill="#8b949e" font-size="11">root : olympus-o-acme   setgid g+rw</text>
<text x="612" y="306" fill="#e6edf3" font-size="11">├── repos/</text>
<text x="612" y="324" fill="#e6edf3" font-size="11">├── vaults/</text>
<text x="612" y="342" fill="#e6edf3" font-size="11">├── sessions/</text>
<text x="612" y="360" fill="#e6edf3" font-size="11">└── workflows/</text>
<text x="612" y="392" fill="#8b949e" font-size="11">alice, bob ∈ olympus-o-acme</text>
<text x="612" y="410" fill="#8b949e" font-size="11">→ org content shared by group</text>
<text x="612" y="428" fill="#8b949e" font-size="11">→ credentials NOT shared (0700)</text>
<text x="612" y="458" fill="#e3b341" font-size="11" font-weight="bold">org = content boundary (ADR 0027)</text>
<text x="612" y="474" fill="#7ee787" font-size="11" font-weight="bold">uid = credential boundary (ADR 0031)</text>

<!-- arrows slices -> org tree -->
<path d="M568 300 L596 300" stroke="#d29922" fill="none" marker-end="url(#b)"/>
<path d="M568 430 L596 430" stroke="#d29922" fill="none" marker-end="url(#b)"/>

<!-- envoy state -->
<rect x="596" y="116" width="282" height="96" rx="8" fill="#161b22" stroke="#f85149"/>
<text x="612" y="140" fill="#ff7b72" font-size="12" font-weight="bold">/var/lib/olympus/envoy/</text>
<text x="612" y="160" fill="#8b949e" font-size="11">spool, index, installation token</text>
<text x="612" y="178" fill="#8b949e" font-size="11">root-only — unreadable from any</text>
<text x="612" y="192" fill="#8b949e" font-size="11">session uid by construction</text>

<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#f85149"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#d29922"/></marker>
</defs>
</svg>
