name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axis-and-orbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches registry + target dir. First run seeds it; later runs skip
      # recompiling the ~339 unchanged dependency crates.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stellarc-release

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      # `stellarc-axis` and `stellarc-orbit` are LIBRARIES; the only binary in
      # the workspace is `stellarc`, which dispatches by role (stellarc axis |
      # stellarc orbit). Building the lib crates produced no executables, so
      # the staging step below failed on a missing file.
      - name: Build release binary
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo build --release -p stellarc

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/stellarc dist/
          cd dist
          sha256sum stellarc > SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: stellarc-linux-x86_64-${{ github.sha }}
          path: dist/
          retention-days: 30

      # Tagged pushes additionally publish a permanent release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stellarc
            dist/SHA256SUMS
