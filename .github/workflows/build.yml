name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hall-and-envoy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Caches registry + target dir. First run seeds it; later runs skip
      # recompiling the ~339 unchanged dependency crates.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: olympus-release

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Build release binaries
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo build --release -p olympus-control-plane -p olympus-envoy

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/release/olympus-hall dist/
          cp target/release/olympus-envoy dist/
          cd dist
          sha256sum olympus-hall olympus-envoy > SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: olympus-linux-x86_64-${{ github.sha }}
          path: dist/
          retention-days: 30

      # Tagged pushes additionally publish a permanent release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/olympus-hall
            dist/olympus-envoy
            dist/SHA256SUMS
