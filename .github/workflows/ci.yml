name: Foundation

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install disposable PostgreSQL binaries
        run: |
          # ubuntu-22.04 runners ship only postgresql-14; the disposable
          # integration fixtures require PG15 binaries (tests/helpers/postgres.ts
          # defaults PG_BIN to /usr/lib/postgresql/15/bin), so add the PGDG apt
          # repository before installing postgresql-15.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-15
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Unit and real PostgreSQL integration bridge
        run: bun test
      - run: bun run build
      - name: Install pinned Chromium and system dependencies
        run: bun x playwright install --with-deps chromium
      - name: Built UI four-viewport smoke and screenshot comparison
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/

  ui-typecheck-budget:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Publish expected-red UI diagnostic count
        shell: bash
        run: |
          set +e
          bun run typecheck:ui > ui-typecheck.log 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          output = Path('ui-typecheck.log').read_text()
          count = len(re.findall(r'error TS\d+:', output))
          budget = json.loads(Path('.forge/ui-typecheck-budget.json').read_text())['count']
          status = int(sys.argv[1])
          summary = f'UI TypeScript diagnostics: {count}; recorded budget: {budget}; compiler exit: {status}\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write(summary)
          if status not in (0, 2) or (status == 2 and count == 0):
              sys.exit('Compiler failed without a usable diagnostic report')
          if count > budget:
              sys.exit('UI typecheck budget increased')
          sys.exit(status)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-typecheck-diagnostics
          path: ui-typecheck.log

  # NEVR-315 — @shadcn/lint design-contract trial on apps/stellarc-ui (T02
  # relief path). Informational, does not gate: same posture as
  # ui-typecheck-budget above. The pass itself is `bun run --cwd
  # apps/stellarc-ui lint:design`; the existing tree carries recorded debt
  # (design-contract-budget.json), so this step compares per-rule counts
  # against that baseline and is green while the debt does not grow. Any
  # net-new violation makes the step red with the rule's remediation
  # message in the log. Lower the budget as debt is paid down; never raise it.
  ui-design-contracts:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Design-contract pass vs recorded budget
        shell: bash
        run: |
          set +e
          bun run --cwd apps/stellarc-ui lint:design > ui-design-contracts.log 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          log = Path('ui-design-contracts.log').read_text()
          status = int(sys.argv[1])
          rules = (
              'no-restyle', 'no-raw-colors', 'no-arbitrary-values',
              'no-inline-styles', 'no-unknown-classes', 'require-static-classes',
          )
          counts = {r: len(re.findall(rf'error shadcn\({r}\)', log)) for r in rules}
          budget_path = Path('apps/stellarc-ui/design-contract-budget.json')
          if not budget_path.exists():
              sys.exit('design-contract budget file missing')
          budget = json.loads(budget_path.read_text())['by_rule']
          # A crashed runner or a config error must not read as "clean".
          if status not in (0, 1) or 'configuration error' in log or 'Config file' in log:
              sys.exit(f'design-contract runner failed (oxlint exit {status})')
          total = sum(counts.values())
          budget_total = sum(budget.get(r, 0) for r in rules)
          summary = 'UI design-contract findings: '
          summary += ', '.join(f'{r} {counts[r]}/{budget.get(r, 0)}' for r in rules if counts[r] or budget.get(r))
          summary += f'; total {total}/{budget_total} (budget in apps/stellarc-ui/design-contract-budget.json)\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write(summary)
          over = [f'{r}: {counts[r]} > budget {budget.get(r, 0)}' for r in rules if counts[r] > budget.get(r, 0)]
          if over:
              sys.exit('UI design-contract budget increased — ' + '; '.join(over))
          sys.exit(0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-design-contracts-log
          path: ui-design-contracts.log
