name: Foundation

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install disposable PostgreSQL binaries
        run: |
          # ubuntu-22.04 runners ship only postgresql-14; the disposable
          # integration fixtures require PG15 binaries (tests/helpers/postgres.ts
          # defaults PG_BIN to /usr/lib/postgresql/15/bin), so add the PGDG apt
          # repository before installing postgresql-15.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-15
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Unit and real PostgreSQL integration bridge
        run: bun test
      - run: bun run build
      - name: Install pinned Chromium and system dependencies
        run: bun x playwright install --with-deps chromium
      - name: Built UI four-viewport smoke and screenshot comparison
        run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/

  # Every gateway check in tools/spikes/auth-llmgw/split-checks.json, each
  # PostgreSQL-backed one against its own throwaway PG16 cluster.
  gateway-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install PostgreSQL 16 binaries
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - run: bun install --frozen-lockfile
      - run: tools/spikes/auth-llmgw/run-checks.sh

  ui-typecheck-budget:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Publish expected-red UI diagnostic count
        shell: bash
        run: |
          set +e
          bun run typecheck:ui > ui-typecheck.log 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          output = Path('ui-typecheck.log').read_text()
          count = len(re.findall(r'error TS\d+:', output))
          budget = json.loads(Path('.forge/ui-typecheck-budget.json').read_text())['count']
          status = int(sys.argv[1])
          summary = f'UI TypeScript diagnostics: {count}; recorded budget: {budget}; compiler exit: {status}\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write(summary)
          if status not in (0, 2) or (status == 2 and count == 0):
              sys.exit('Compiler failed without a usable diagnostic report')
          if count > budget:
              sys.exit('UI typecheck budget increased')
          # Budget respected: never re-export the compiler's exit code —
          # tsc exits 2 whenever any known legacy diagnostic exists, which
          # is the normal, budgeted state of this tree.
          sys.exit(0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-typecheck-diagnostics
          path: ui-typecheck.log

  # NEVR-586 — knip dead-code gate on apps/web, day one (Multica #10331
  # pattern: a full-time team still accumulated 2,832 lines of unreferenced
  # frontend code; the purge made the detector a blocking gate). apps/web is
  # young enough that the baseline is zero findings — every row of the
  # NEVR-583 trial report was deleted or un-exported, none suppressed — and
  # the gate holds that line as the agent views grow. knip is exact-pinned in
  # the root devDependencies; knip.jsonc maps the workspaces (tests/bun is a
  # real cross-workspace consumer of the NEVR-544 F5 surface). Blocking from
  # the start: a warn-only gate re-creates the accumulation this exists to
  # prevent. Negative control recorded in tests/bun/web-knip-gate.test.ts.
  ui-knip:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: knip dead-code pass on apps/web
        shell: bash
        run: |
          set +e
          bunx knip --workspace apps/web > knip.log 2>&1
          status=$?
          set -e
          cat knip.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-knip-log
          path: knip.log

  # NEVR-603 — scope-root audit on the HttpApi + MCP surface, day one. Every
  # route (48 HttpApi endpoints, 32 MCP tools) must carry a declared object
  # scope root (org/board/task/user-self/public) with structural parent
  # provenance, credential routes must answer RateLimited, secret material
  # may only appear on create-apikey's success, and cursor/redirect-ish
  # request fields must be consciously registered. Blocking from the start,
  # the knip-gate pattern (NEVR-586) applied to authorization: a warn-only
  # audit re-creates the per-route accumulation Plane purged in v1.5.0-rc1.
  # Negative controls recorded in tests/bun/scope-audit-gate.test.ts.
  scope-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Scope-root audit (HttpApi + MCP)
        shell: bash
        run: |
          set +e
          bun run scope:audit > scope-audit.log 2>&1
          status=$?
          set -e
          cat scope-audit.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        name: Upload scope-audit log
        with:
          name: scope-audit-log
          path: scope-audit.log

  # NEVR-455 — @shadcn/lint design contracts on apps/web, day one. Blocking:
  # apps/web is greenfield (ADR 0014), so the tree carries no recorded debt
  # and every contract can gate from the start — a seeded violation turns this
  # red (negative control recorded in tests/bun/design-contracts.test.ts),
  # #172's tree as merged passes. The pass itself is `bun run --cwd apps/web
  # lint:design`; the repo linter stays Biome (root `bun run lint`), this job
  # is additive and scoped to apps/web/src. Exceptions live in
  # apps/web/.oxlintrc.json — tune allowlists and contracts, never delete
  # rules, and shrink them as the app.css port reconciles with
  # docs/design/shell/shell.css. SHADCN_LINT_TAILWIND_TIMEOUT (lint#165,
  # milliseconds) guards the Tailwind worker on cold CI machines: without it a
  # slow theme build silently falls back to the bundled grammar and
  # no-unknown-classes degrades to checking less.
  ui-design-contracts:
    runs-on: ubuntu-22.04
    env:
      SHADCN_LINT_TAILWIND_TIMEOUT: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Design-contract pass on apps/web
        shell: bash
        run: |
          set +e
          bun run --cwd apps/web lint:design > design-contract.log 2>&1
          status=$?
          set -e
          cat design-contract.log
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-design-contracts-log
          path: design-contract.log

  # NEVR-620 — @google/design.md spec lint on the root DESIGN.md, day one.
  # The NEVR-620 cleanup drove orphaned-tokens to zero: every Paper palette
  # token and the dark surfaces/lines/accent tokens now have consuming
  # component entries, so the tree is debt-free and the gate blocks from
  # the start (NEVR-455 greenfield precedent). The 0.4.0 CLI exits nonzero
  # only on errors — warnings (orphaned tokens, sub-token contract drift)
  # stay exit 0 — so the step parses the JSON summary and fails on any
  # warning too; stdout (the report) and stderr (bunx install chatter) are
  # kept apart so the report stays parseable. Version pinned at exactly
  # 0.4.0: the spec is `version: alpha` and its schema moves, so a bump is
  # a deliberate fold like any dependency, never latest. Negative control
  # recorded in tests/bun/design-doc-gate.test.ts.
  design-doc-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: DESIGN.md spec lint (errors and warnings both gate)
        shell: bash
        run: |
          set +e
          bunx @google/design.md@0.4.0 lint DESIGN.md > design-doc-lint.log 2> design-doc-lint-stderr.log
          status=$?
          set -e
          cat design-doc-lint.log
          echo "--- stderr ---"
          cat design-doc-lint-stderr.log
          python3 - "$status" <<'PY'
          import json, sys
          from pathlib import Path
          status = int(sys.argv[1])
          if status not in (0, 1):
              sys.exit(f"lint exited {status} without a JSON report")
          try:
              report = json.loads(Path("design-doc-lint.log").read_text())
          except json.JSONDecodeError as error:
              sys.exit(f"design-doc-lint.log is not the lint's JSON report: {error}")
          for finding in report.get("findings", []):
              if finding.get("severity") != "info":
                  print(f"{finding.get('severity')}: {finding.get('path', '-')} "
                        f"[{finding.get('rule')}]: {finding.get('message')}")
          summary = report.get("summary", {})
          print(f"DESIGN.md lint: {summary.get('errors', 0)} errors, "
                f"{summary.get('warnings', 0)} warnings — gate allows 0/0")
          sys.exit(1 if summary.get("errors", 0) or summary.get("warnings", 0) else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-doc-lint-log
          path: design-doc-lint.log

  # NEVR-455 — onsystem diff-scoped design-system check on apps/web.
  # Non-blocking (continue-on-error) until the lint is tuned, then flips to a
  # gate in a follow-up. Where ui-design-contracts above checks the whole
  # tree, dgesteves/onsystem checks ONLY the lines a pull request changes (its
  # only-changed-lines default) for raw palette colors, native elements the
  # design system replaces, and design-system APIs the app lacks. The job runs
  # only on pull requests whose diff touches apps/web/src/components/** (a
  # git-diff gate below — workflow-level `paths:` would skip every other job
  # in this file). No bun install: the action runs its pinned CLI through npx.
  onsystem-diff:
    runs-on: ubuntu-22.04
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The action diffs the PR against event.pull_request.base.sha
          # itself; a full checkout keeps that reliable (and feeds the gate).
          fetch-depth: 0
      - name: Gate on the diff touching apps/web/src/components/**
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"..."$GITHUB_SHA" -- apps/web/src/components/ | grep -q .; then
            echo "components=true" >> "$GITHUB_OUTPUT"
          else
            echo "components=false" >> "$GITHUB_OUTPUT"
            echo "PR diff does not touch apps/web/src/components/** — onsystem skipped."
          fi
      - name: onsystem — diff-scoped design-system check
        if: steps.diff.outputs.components == 'true'
        # Pinned to the v0.12.1 release commit: the floating v0 tag has already
        # moved under us once (NEVR-333 defect 3), so a mutable tag is a proven
        # risk here.
        uses: dgesteves/onsystem@8f84b7aad1bcf6caa12012e6beb35e87eb55d85a # v0.12.1
        with:
          working-directory: apps/web
          # Non-blocking trial posture: report every finding (warnings
          # included) while continue-on-error keeps the PR mergeable.
          fail-on: warning
