name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The single stellarc binary must keep compiling for Windows: the desktop app
  # bundles it there. Nothing guarded this before — every other workflow is
  # ubuntu-only, so a Windows regression would land silently (ADR 0035 §3.15).
  #
  # Checks the whole binary (-p stellarc, --all-targets), not one lib: the point
  # is that the single artifact builds. Unix-only surfaces (pty, process groups,
  # UDS, Axis-local terminals) are cfg-gated and compile away; what is
  # unavailable on Windows is *running* the orbit role, not building it.
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (windows, whole binary)
        run: cargo check -p stellarc --all-targets --target x86_64-pc-windows-msvc

  bundle:
    needs: windows-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Tauri's Linux bundle needs webkit2gtk + the AppImage tooling.
      - name: linux bundle deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf mold

      - name: install ui deps
        run: cd ui && bun install --frozen-lockfile

      # desktop/package.json declares @tauri-apps/cli, which tauriScript below
      # invokes as `bun run --cwd desktop tauri`. Without this the CLI is absent
      # and the bundle step dies with "tauri: command not found".
      - name: install desktop (tauri cli) deps
        run: cd desktop && bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: bun run --cwd desktop tauri
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: stellarc-desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: warn
