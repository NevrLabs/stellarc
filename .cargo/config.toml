# Build-speed config is OPT-IN, not mandatory: a tracked rustflags entry
# pinning a non-default linker breaks every clone that lacks it (CI hit
# `collect2: fatal error: cannot find 'ld'` from -fuse-ld=mold).
#
# To use mold locally, either install it and export:
#   RUSTFLAGS="-C link-arg=-fuse-ld=mold"
# or drop a personal (untracked) .cargo/config.toml in your home dir.
