[package]
name = "stellarc-tunnel"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[lib]
name = "stellarc_tunnel"

[dependencies]
anyhow = "1"
iroh = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time"] }
