[package]
name = "stellarc-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Stellarc Desktop — bundles and supervises a local Axis (Lite edition)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Axis runs in-process: one artifact, one version, no cross-version protocol
# skew between the shell and the control plane it supervises (ADR 0035 §1.2).
stellarc-axis = { path = "../crates/axis" }

[features]
# Tauri's default CSP/devtools split; nothing custom yet.
default = []

[lib]
name = "stellarc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
